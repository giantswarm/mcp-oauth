name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Cache Go tools
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile.custom.mk') }}
        restore-keys: |
          ${{ runner.os }}-go-tools-

    - name: Install analysis tools
      run: make install-analyze-tools

    - name: Run make verify
      run: make verify

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Build all examples
      run: make build-examples
