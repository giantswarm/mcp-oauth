name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Cache Go tools
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile.custom.mk') }}
        restore-keys: |
          ${{ runner.os }}-go-tools-

    - name: Install analysis tools
      run: make install-analyze-tools

    - name: Run make verify
      run: make verify

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Build all examples
      run: make build-examples
