name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Cache Go tools
      uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile.custom.mk') }}
        restore-keys: |
          ${{ runner.os }}-go-tools-

    - name: Install analysis tools
      run: make install-analyze-tools

    - name: Run make verify
      run: make verify

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Determine Go version from toolchain directive
      id: go-version
      run: |
        version=$(awk '/^toolchain go/ { print substr($2, 3) }' go.mod)
        if [ -z "$version" ]; then
          version=$(awk '/^go / { print $2 }' go.mod)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go-version.outputs.version }}

    - name: Build all examples
      run: make build-examples
