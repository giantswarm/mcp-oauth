# golangci-lint configuration for mcp-oauth.
#
# The platform-standard pre-commit golangci-lint hook (.pre-commit-config.yaml,
# maintained centrally) auto-discovers this file. It carries the extra quality
# linters that used to run as bespoke `make` targets in the now-removed
# hand-written ci.yml, so the same checks keep running -- in the standard place
# -- on every PR.
#
# Thresholds and exclusions mirror the previous make targets: complexity "-over
# 15" (fail above 15, i.e. min-complexity 16), dupl threshold 100, and tests +
# examples excluded.
version: "2"

linters:
  enable:
    - gocyclo
    - gocognit
    - dupl
  settings:
    gocyclo:
      min-complexity: 16
    gocognit:
      min-complexity: 16
    dupl:
      threshold: 100
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - dupl
      # Test fixtures repeat protocol strings by design; constants would only
      # obscure what each case asserts (mirrors giantswarm/klaus-operator).
      - path: _test\.go
        linters:
          - goconst
      # Test fixtures legitimately hardcode credential-shaped values (G101)
      # and marshal token-shaped structs for mock provider responses (G117).
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G117"
      - path: ^examples/
        linters:
          - gocyclo
          - gocognit
          - dupl

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - ^examples/
